# Formulaire ouvert par le bouton « Idée ou bug » de Quai PDF : les identifiants des champs (id) sont remplis par
# l'adresse (src/QuaiPdf.Core/ViewModels/FeedbackViewModel.cs). Ne pas les renommer sans changer l'application.
name: Proposer une idée
description: Une fonction qui vous manque dans Quai PDF.
labels: ["enhancement"]
body:
  - type: input
    id: domaine
    attributes:
      label: Partie de Quai PDF concernée
      placeholder: "Lecture, pages (rotation, ordre, insertion, extraction), texte, zones de texte, propriétés, réglages…"
  - type: textarea
    id: description
    attributes:
      label: Ce que vous aimeriez pouvoir faire, et pourquoi
      description: Décrivez la situation où cette fonction vous servirait.
    validations:
      required: true
  - type: textarea
    id: systeme
    attributes:
      label: Version de Quai PDF et de Windows
      render: text
